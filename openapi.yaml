openapi: 3.0.3
info:
  title: Магазин запчастей
  description: Развалов Никита 23-ИСбо-1
  version: 0.0.1
servers:
  - url: http://localhost:8000/api/v1/
    description: dev server
paths:
  /sparts:
    get:
      summary: Метод получения запчастей
      tags:
        - SpareParts
      operationId: getAllParts
      responses:
        "200":
          description: "Условный ответ со списком запчастей"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpareParts"
        "default": #всё что не 200
          description: Всё нестандартное
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sparts/{spare_id}:
    get:
      summary: Метод получения запчасти по идентификатору
      tags:
        - SpareParts
      operationId: getAllPartsById
      parameters: 
        - name: spare_id
          in: path
          required: true
          description: Идентификатор запчасти
          schema:
            type: string
          example: 42abcd2b-8b9c-4af9-88f7-0bc100fc74b
      responses:
        "200":
          description: "Условный ответ с запчастью"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SparePart"
        "default": #всё что не 200
          description: Всё нестандартное
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    SparePart:
      type: object
      required:
        - name
        - status 
      properties:
        spare_id:
          type: string
          example: 42abcd2b-8b9c-4af9-88f7-0bc100fc74b
        name:
          type: string
          example: Дверь
        status:
          type: string
          enum:
           - new
           - old
           - broken
          description: Состояние запчасти
        created_at:
           type: string
           format: 2025-03-01T15:00:00:01
    SpareParts:
        type: array
        items:
          $ref: "#/components/schemas/SparePart" #ссылаемся на запчасть
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string